<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login e Cadastro - RECOVER</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#3B82F6", // Accessible Blue
              "secondary": "#8B5CF6", // Subtle Purple
              "background-light": "#f6f7f8",
              "background-dark": "#111827",
              "card-dark": "#1F2937",
              "text-light": "#1F2937",
              "text-dark": "#F9FAFB",
              "border-dark": "#4B5563"
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="layout-container flex h-full grow flex-col items-center justify-center w-full">
<!-- PageHeading -->
<div class="flex flex-col items-center gap-2 mb-8 text-center">
<h1 class="text-text-light dark:text-white text-5xl font-black tracking-[-0.033em]">RECOVER</h1>
<p class="text-slate-500 dark:text-[#9daeb9] text-lg">Bem-vindo ao sistema de achados e perdidos</p>
</div>
<div class="layout-content-container flex flex-col w-full max-w-md rounded-xl bg-white dark:bg-card-dark shadow-lg">
<!-- Tabs -->
<div class="pb-0">
<div class="flex border-b border-slate-200 dark:border-border-dark px-4 gap-8">
<a class="flex flex-col items-center justify-center border-b-[3px] border-b-primary text-primary pb-[13px] pt-4" href="#">
<p class="text-sm font-bold leading-normal tracking-[0.015em]">Login</p>
</a>
<a class="flex flex-col items-center justify-center border-b-[3px] border-b-transparent text-slate-500 dark:text-[#9daeb9] pb-[13px] pt-4 hover:text-primary transition-colors" href="#">
<p class="text-sm font-bold leading-normal tracking-[0.015em]">Cadastre-se</p>
</a>
</div>
</div>
<!-- Login Form Content -->
<div class="p-6 sm:p-8">
<!-- TitleText -->
<h2 class="text-text-light dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] text-left pb-5">Bem-vindo de volta!</h2>
<form class="flex flex-col gap-4">
<!-- TextField: E-mail -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light dark:text-white text-base font-medium leading-normal pb-2">E-mail</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-border-dark bg-slate-50 dark:bg-[#111827] h-14 placeholder:text-slate-400 dark:placeholder:text-[#9daeb9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="seuemail@exemplo.com" type="email" value=""/>
</label>
</div>
<!-- TextField: Senha -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light dark:text-white text-base font-medium leading-normal pb-2">Senha</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-border-dark bg-slate-50 dark:bg-[#111827] h-14 placeholder:text-slate-400 dark:placeholder:text-[#9daeb9] p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal transition-all" placeholder="Sua senha" type="password" value=""/>
<div class="text-slate-400 dark:text-[#9daeb9] flex border border-slate-300 dark:border-border-dark bg-slate-50 dark:bg-[#111827] items-center justify-center pr-[15px] rounded-r-lg border-l-0">
<span class="material-symbols-outlined" data-icon="Eye">visibility</span>
</div>
</div>
</label>
</div>
<!-- Options: Remember me & Forgot Password -->
<div class="flex items-center justify-between mt-2">
<div class="flex items-center gap-2">
<input class="form-checkbox h-4 w-4 rounded bg-slate-50 dark:bg-card-dark border-slate-300 dark:border-border-dark text-primary focus:ring-primary/50" id="remember-me" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-300" for="remember-me">Lembrar-me</label>
</div>
<a class="text-sm font-medium text-primary hover:underline" href="#">Esqueci minha senha?</a>
</div>
<!-- Primary Button -->
<button class="flex w-full items-center justify-center rounded-lg bg-primary h-14 px-6 text-base font-bold text-white shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark transition-colors mt-6" type="submit">
                            Entrar
                        </button>
</form>
</div>
<!-- Hidden by default Cadastro Form for demonstration purposes. In a real app, this would be handled by JS. -->
<!-- To view the register form, you can temporarily remove the 'hidden' class from the div below -->
<div class="p-6 sm:p-8 hidden">
<!-- TitleText -->
<h2 class="text-text-light dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] text-left pb-5">Crie sua conta</h2>
<form class="flex flex-col gap-4">
<!-- Nome Completo -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light dark:text-white text-base font-medium leading-normal pb-2">Nome Completo</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-border-dark bg-slate-50 dark:bg-[#111827] h-14 placeholder:text-slate-400 dark:placeholder:text-[#9daeb9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="Seu nome completo" type="text" value=""/>
</label>
</div>
<!-- E-mail -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light dark:text-white text-base font-medium leading-normal pb-2">E-mail</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-border-dark bg-slate-50 dark:bg-[#111827] h-14 placeholder:text-slate-400 dark:placeholder:text-[#9daeb9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="seuemail@exemplo.com" type="email" value=""/>
</label>
</div>
<!-- Senha -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light dark:text-white text-base font-medium leading-normal pb-2">Senha</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-border-dark bg-slate-50 dark:bg-[#111827] h-14 placeholder:text-slate-400 dark:placeholder:text-[#9daeb9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="Crie uma senha forte" type="password" value=""/>
</label>
</div>
<!-- Confirmar Senha -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-text-light dark:text-white text-base font-medium leading-normal pb-2">Confirmar Senha</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-border-dark bg-slate-50 dark:bg-[#111827] h-14 placeholder:text-slate-400 dark:placeholder:text-[#9daeb9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="Repita a senha" type="password" value=""/>
</label>
</div>
<!-- Terms of use -->
<div class="flex items-start gap-3 mt-2">
<input class="form-checkbox h-4 w-4 rounded bg-slate-50 dark:bg-card-dark border-slate-300 dark:border-border-dark text-primary focus:ring-primary/50 mt-1 flex-shrink-0" id="terms" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-300" for="terms">Eu aceito os <a class="font-medium text-primary hover:underline" href="#">Termos de Uso</a> e <a class="font-medium text-primary hover:underline" href="#">Política de Privacidade</a>.</label>
</div>
<!-- Primary Button -->
<button class="flex w-full items-center justify-center rounded-lg bg-primary h-14 px-6 text-base font-bold text-white shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark transition-colors mt-6" type="submit">
                            Cadastrar
                        </button>
</form>
</div>
</div>
</div>
</div>
</body></html>
